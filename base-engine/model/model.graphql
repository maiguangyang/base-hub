directive @hasRole(role: Role!) on FIELD_DEFINITION | INPUT_FIELD_DEFINITION
directive @hasPermission(action: String!) on FIELD_DEFINITION
directive @validator(required: String, immutable: String, type: String, minLength: Int, maxLength: Int, minValue: Int, maxValue: Int, unique: String, uniqueScope: String) on INPUT_FIELD_DEFINITION

enum Role {
  ALL
  ADMIN
  USER
  GUEST
}

enum AccountStatus {
  ACTIVE
  DISABLED
}

enum OrganizationType {
  HEADQUARTERS
  FRANCHISE
}

enum OrganizationStatus {
  ACTIVE
  SUSPENDED
}

enum MembershipStatus {
  INVITED
  ACTIVE
  SUSPENDED
  LEFT
}

enum StoreAccessMode {
  ALL_STORES
  SELECTED_STORES
}

enum RoleKind {
  HQ_SUPER_ADMIN
  FRANCHISE_OWNER
  CUSTOM
}

enum PermissionScope {
  SYSTEM
  TENANT
}

enum StoreLifecycle {
  DRAFT
  PENDING_APPROVAL
  ACTIVE
  REJECTED
}

enum StoreBusinessStatus {
  OPEN
  CLOSED
}

enum WorkspaceType {
  DISCOVERY
  HEADQUARTERS
  FRANCHISE
}

enum FranchiseOpeningSource {
  SYSTEM_PROVISION
  HISTORICAL_ATTESTATION
}

type Account @entity(title: "账号") {
  phone: String! @column(gorm: "type:varchar(32);NOT NULL;uniqueIndex;") @validator(required: "true", type: "phone", unique: "true")
  displayName: String! @column(gorm: "type:varchar(64);NOT NULL;") @validator(required: "true", minLength: 1, maxLength: 64)
  email: String @column(gorm: "type:varchar(128);default:null;") @validator(type: "email")
  status: AccountStatus! @column(gorm: "type:varchar(24);NOT NULL;index;")
  mustChangePassword: Boolean! @column(gorm: "NOT NULL;default:true;")
  credentialVersion: Int! @column(gorm: "NOT NULL;default:1;")
  memberships: [OperatorMembership!]! @relationship(inverse: "account")
  initializedOrganizations: [Organization!]! @relationship(inverse: "initialAccount")
  openingRecords: [FranchiseOpeningRecord!]! @relationship(inverse: "initialAccount")
  recordedOpeningRecords: [FranchiseOpeningRecord!]! @relationship(inverse: "recordedByAccount")
  sessions: [Session!]! @relationship(inverse: "account")
  reviewedStores: [Store!]! @relationship(inverse: "reviewedByAccount")
  sentMembershipInvitations: [MembershipInvitation!]! @relationship(inverse: "invitedByAccount")
  auditLogs: [AuditLog!]! @relationship(inverse: "actorAccount")
}

type Organization @entity(title: "加盟商") {
  code: String! @column(gorm: "type:varchar(32);NOT NULL;uniqueIndex;") @validator(required: "true", unique: "true", minLength: 2, maxLength: 32)
  name: String! @column(gorm: "type:varchar(128);NOT NULL;") @validator(required: "true", minLength: 1, maxLength: 128)
  type: OrganizationType! @column(gorm: "type:varchar(24);NOT NULL;index;")
  status: OrganizationStatus! @column(gorm: "type:varchar(24);NOT NULL;index;")
  suspendedAt: Time @column
  suspensionReasonCode: String @column(gorm: "type:varchar(64);default:null;")
  memberships: [OperatorMembership!]! @relationship(inverse: "organization")
  initialAccount: Account @relationship(inverse: "initializedOrganizations")
  openingRecords: [FranchiseOpeningRecord!]! @relationship(inverse: "organization")
  stores: [Store!]! @relationship(inverse: "organization")
  roles: [OperatorRole!]! @relationship(inverse: "organization")
  sessions: [Session!]! @relationship(inverse: "organization")
  auditLogs: [AuditLog!]! @relationship(inverse: "organization")
  paymentConfigs: [FranchisePaymentConfig!]! @relationship(inverse: "organization")
}

type OperatorMembership @entity(title: "加盟商成员") {
  status: MembershipStatus! @column(gorm: "type:varchar(24);NOT NULL;index;")
  storeAccessMode: StoreAccessMode! @column(gorm: "type:varchar(24);NOT NULL;")
  invitedAt: Time @column
  acceptedAt: Time @column
  account: Account! @relationship(inverse: "memberships")
  organization: Organization! @relationship(inverse: "memberships")
  roles: [OperatorRole!]! @relationship(inverse: "members")
  stores: [Store!]! @relationship(inverse: "members")
  invitations: [MembershipInvitation!]! @relationship(inverse: "membership")
}

type Permission @entity(title: "权限") {
  name: String! @column(gorm: "type:varchar(128);NOT NULL;") @validator(required: "true", minLength: 1, maxLength: 128)
  action: String! @column(gorm: "type:varchar(96);NOT NULL;uniqueIndex;") @validator(required: "true", unique: "true", minLength: 3, maxLength: 96)
  module: String! @column(gorm: "type:varchar(64);NOT NULL;index;")
  scope: PermissionScope! @column(gorm: "type:varchar(16);NOT NULL;index;")
  roles: [OperatorRole!]! @relationship(inverse: "permissions")
}

type OperatorRole @entity(title: "角色") {
  name: String! @column(gorm: "type:varchar(64);NOT NULL;") @validator(required: "true", minLength: 1, maxLength: 64, unique: "true", uniqueScope: "organizationId")
  kind: RoleKind! @column(gorm: "type:varchar(32);NOT NULL;index;")
  organization: Organization! @relationship(inverse: "roles")
  members: [OperatorMembership!]! @relationship(inverse: "roles")
  permissions: [Permission!]! @relationship(inverse: "roles")
}

type Store @entity(title: "门店") {
  code: String! @column(gorm: "type:varchar(32);NOT NULL;") @validator(required: "true", minLength: 1, maxLength: 32, unique: "true", uniqueScope: "organizationId")
  name: String! @column(gorm: "type:varchar(128);NOT NULL;") @validator(required: "true", minLength: 1, maxLength: 128)
  lifecycle: StoreLifecycle! @column(gorm: "type:varchar(32);NOT NULL;index;")
  submittedAt: Time @column
  reviewedAt: Time @column
  rejectionReason: String @column(gorm: "type:varchar(512);default:null;") @validator(maxLength: 512)
  contactPhone: String @column(gorm: "type:varchar(32);default:null;") @validator(maxLength: 32)
  managerName: String @column(gorm: "type:varchar(64);default:null;") @validator(maxLength: 64)
  managerPhone: String @column(gorm: "type:varchar(32);default:null;") @validator(maxLength: 32)
  province: String @column(gorm: "type:varchar(64);default:null;") @validator(maxLength: 64)
  city: String @column(gorm: "type:varchar(64);default:null;") @validator(maxLength: 64)
  district: String @column(gorm: "type:varchar(64);default:null;") @validator(maxLength: 64)
  address: String @column(gorm: "type:varchar(256);default:null;") @validator(maxLength: 256)
  businessHours: String @column(gorm: "type:varchar(64);default:null;") @validator(maxLength: 64)
  businessStatus: StoreBusinessStatus @column(gorm: "type:varchar(32);default:null;")
  supportDineIn: Boolean @column(gorm: "default:true;")
  supportTakeout: Boolean @column(gorm: "default:true;")
  storeArea: Float @column(gorm: "default:null;")
  tableCount: Int @column(gorm: "default:null;")
  receiptFooter: String @column(gorm: "type:varchar(256);default:null;") @validator(maxLength: 256)
  businessLicenseImageUrl: String @column(gorm: "type:varchar(512);default:null;") @validator(maxLength: 512)
  otherDocumentImageUrl: String @column(gorm: "type:varchar(512);default:null;") @validator(maxLength: 512)
  organization: Organization! @relationship(inverse: "stores")
  members: [OperatorMembership!]! @relationship(inverse: "stores")
  reviewedByAccount: Account @relationship(inverse: "reviewedStores")
  auditLogs: [AuditLog!]! @relationship(inverse: "store")
  paymentConfigs: [StorePaymentConfig!]! @relationship(inverse: "store")
}

type Session @entity(title: "登录会话") {
  workspaceType: WorkspaceType! @column(gorm: "type:varchar(24);NOT NULL;index;")
  credentialVersion: Int! @column(gorm: "NOT NULL;")
  expiresAt: Time! @column(gorm: "NOT NULL;index;")
  revokedAt: Time @column
  revocationCode: String @column(gorm: "type:varchar(64);default:null;")
  lastSeenAt: Time! @column(gorm: "NOT NULL;")
  account: Account! @relationship(inverse: "sessions")
  organization: Organization @relationship(inverse: "sessions")
  auditLogs: [AuditLog!]! @relationship(inverse: "session")
}

type MembershipInvitation @entity(title: "成员邀请") {
  expiresAt: Time! @column(gorm: "NOT NULL;index;")
  acceptedAt: Time @column
  revokedAt: Time @column
  membership: OperatorMembership! @relationship(inverse: "invitations")
  invitedByAccount: Account! @relationship(inverse: "sentMembershipInvitations")
}

type AuditLog @entity(title: "审计日志") {
  action: String! @column(gorm: "type:varchar(96);NOT NULL;index;")
  resourceType: String! @column(gorm: "type:varchar(64);NOT NULL;index;")
  resourceId: String @column(gorm: "type:varchar(36);default:null;index;")
  resultCode: String! @column(gorm: "type:varchar(64);NOT NULL;index;")
  metadataJson: String @column(gorm: "type:text;")
  actorAccount: Account @relationship(inverse: "auditLogs")
  session: Session @relationship(inverse: "auditLogs")
  organization: Organization @relationship(inverse: "auditLogs")
  store: Store @relationship(inverse: "auditLogs")
}

type FranchiseOpeningRecord @entity(title: "加盟商开通记录") {
  recordNumber: String! @column(gorm: "type:varchar(128);NOT NULL;uniqueIndex;") @validator(required: "true", unique: "true", minLength: 1, maxLength: 128)
  source: FranchiseOpeningSource! @column(gorm: "type:varchar(32);NOT NULL;index;")
  organization: Organization! @relationship(inverse: "openingRecords")
  initialAccount: Account! @relationship(inverse: "openingRecords")
  recordedByAccount: Account! @relationship(inverse: "recordedOpeningRecords")
}

type GlobalPaymentConfig @entity(title: "全局支付配置") {
  channel: String! @column(gorm: "type:varchar(16);NOT NULL;") @validator(required: "true", unique: "true")
  merchantId: String @column(gorm: "type:varchar(64);default:null;")
  environment: String @column(gorm: "type:varchar(16);default:null;")
  ratePpm: Int! @column(gorm: "type:int;NOT NULL;default:0;") @validator(minValue: 0, maxValue: 1000000)
  configState: String! @column(gorm: "type:varchar(16);NOT NULL;")
  version: Int! @column(gorm: "type:bigint;NOT NULL;")
  keyId: String @column(gorm: "type:varchar(64);default:null;")
  credentialCiphertext: String @column(gorm: "type:longtext;default:null;")
}

type FranchisePaymentConfig @entity(title: "加盟商支付配置") {
  channel: String! @column(gorm: "type:varchar(16);NOT NULL;") @validator(required: "true", unique: "true", uniqueScope: "organizationId")
  merchantId: String @column(gorm: "type:varchar(64);default:null;")
  environment: String @column(gorm: "type:varchar(16);default:null;")
  ratePpm: Int! @column(gorm: "type:int;NOT NULL;default:0;") @validator(minValue: 0, maxValue: 1000000)
  configState: String! @column(gorm: "type:varchar(16);NOT NULL;")
  version: Int! @column(gorm: "type:bigint;NOT NULL;")
  keyId: String @column(gorm: "type:varchar(64);default:null;")
  credentialCiphertext: String @column(gorm: "type:longtext;default:null;")
  organization: Organization! @relationship(inverse: "paymentConfigs")
}

type StorePaymentConfig @entity(title: "门店支付配置") {
  channel: String! @column(gorm: "type:varchar(16);NOT NULL;") @validator(required: "true", unique: "true", uniqueScope: "storeId")
  merchantId: String @column(gorm: "type:varchar(64);default:null;")
  environment: String @column(gorm: "type:varchar(16);default:null;")
  ratePpm: Int! @column(gorm: "type:int;NOT NULL;default:0;") @validator(minValue: 0, maxValue: 1000000)
  configState: String! @column(gorm: "type:varchar(16);NOT NULL;")
  version: Int! @column(gorm: "type:bigint;NOT NULL;")
  keyId: String @column(gorm: "type:varchar(64);default:null;")
  credentialCiphertext: String @column(gorm: "type:longtext;default:null;")
  store: Store! @relationship(inverse: "paymentConfigs")
}
