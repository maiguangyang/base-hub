input LoginInput {
  phone: String!
  password: String!
}

input ChangePasswordInput {
  currentPassword: String!
  newPassword: String!
}

input SelectWorkspaceInput {
  workspaceType: WorkspaceType!
  organizationId: ID
}

input ProvisionFranchiseInput {
  code: String!
  name: String!
  ownerPhone: String!
  ownerDisplayName: String!
  ownerEmail: String
}

input InviteOperatorInput {
  phone: String!
  displayName: String!
  email: String
  roleIds: [ID!]!
  storeAccessMode: StoreAccessMode!
  storeIds: [ID!]!
}

input ReviewStoreInput {
  storeId: ID!
  approved: Boolean!
  rejectionReason: String
}

enum StoreDocumentKind {
  BUSINESS_LICENSE
  OTHER
}

input SuspendOrganizationInput {
  organizationId: ID!
  reasonCode: String!
}

input ChangeMembershipStatusInput {
  membershipId: ID!
  status: MembershipStatus!
}

type Workspace {
  workspaceType: WorkspaceType!
  organizationId: ID
  organizationName: String!
  homePath: String!
}

type Viewer {
  account: Account!
  currentWorkspace: Workspace
  workspaces: [Workspace!]!
  permissions: [String!]!
}

type LoginPayload {
  viewer: Viewer!
  requiresPasswordChange: Boolean!
}

type ProvisionFranchisePayload {
  organization: Organization!
  membership: OperatorMembership!
  temporaryPassword: String
  invitationPending: Boolean!
}

type InviteOperatorPayload {
  membership: OperatorMembership!
  temporaryPassword: String
  invitationPending: Boolean!
}

type TemporaryPasswordPayload {
  accountId: ID!
  temporaryPassword: String!
}

type StoreDocumentPayload {
  store: Store!
  kind: StoreDocumentKind!
  attachmentId: ID!
}

extend type Query {
  viewer: Viewer!
  workspaces: [Workspace!]!
  pendingMembershipInvitations: [MembershipInvitation!]!
  securityBootstrapStatus: SecurityBootstrapStatus!
}

extend type Mutation {
  login(input: LoginInput!): LoginPayload!
  logout: Boolean!
  changeTemporaryPassword(input: ChangePasswordInput!): Viewer!
  selectWorkspace(input: SelectWorkspaceInput!): Viewer!
  provisionFranchise(input: ProvisionFranchiseInput!): ProvisionFranchisePayload! @hasPermission(action: "organization:create")
  suspendOrganization(input: SuspendOrganizationInput!): Organization! @hasPermission(action: "organization:suspend")
  restoreOrganization(id: ID!): Organization! @hasPermission(action: "organization:restore")
  inviteOperator(input: InviteOperatorInput!): ProvisionFranchisePayload! @hasPermission(action: "operatorMembership:create")
  changeMembershipStatus(input: ChangeMembershipStatusInput!): OperatorMembership! @hasPermission(action: "operatorMembership:update")
  reviewStore(input: ReviewStoreInput!): Store! @hasPermission(action: "store:approve")
  setStoreDocument(storeId: ID!, kind: StoreDocumentKind!, attachmentId: ID!): Store! @hasPermission(action: "store:update")
  removeStoreDocument(storeId: ID!, kind: StoreDocumentKind!): Store! @hasPermission(action: "store:update")
  resetTemporaryPassword(accountId: ID!): TemporaryPasswordPayload! @hasPermission(action: "account:update")
  resetFranchiseInitialPassword(organizationId: ID!): TemporaryPasswordPayload! @hasPermission(action: "account:update")
}

extend type Subscription {
  sessionEvents: SessionEvent!
}

type SecurityBootstrapStatus {
  hqAdministratorBootstrapped: Boolean!
}

enum SessionEventCode {
  SESSION_REVOKED
  ORGANIZATION_SUSPENDED
  CREDENTIALS_CHANGED
}

type SessionEvent {
  code: SessionEventCode!
  sessionId: ID!
  organizationId: ID
  occurredAt: Time!
}
